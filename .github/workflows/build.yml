name: Build DexMate Snap

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Update system packages
        run: |
          sudo apt update
          sudo apt full-upgrade -y

      - name: Install build dependencies
        run: |
          sudo apt install -y \
            build-essential gfortran git libblas-dev liblapack-dev pkg-config \
            python3-dev python3-pip python3-tk tcl-dev tk-dev

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build Snap
        run: snapcraft --destructive-mode
